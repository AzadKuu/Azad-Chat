# Azad-Chat 代理端配置（所有渲染都在这里完成）

redis:
  host: 127.0.0.1
  port: 6379
  # 留空 = 不发送 AUTH；服务器有密码时填这里
  password: ""
  # 必须与子服一致
  channel: azad-chat

tab:
  # TAB 的 groups.yml：服务器名 / 头衔的单一数据源（相对本插件数据目录 = plugins/tab/groups.yml）
  groups-yml: "../tab/groups.yml"
  # 找不到对应服务器时用的标签
  fallback-tag: ""

# 中文昵称数据源（ChineseName 的 config.yml）。
# 本插件会把它注册成 TAB 玩家占位符 %azadchat_nick%，
# 在 velocity/plugins/tab/groups.yml 里用 customtabname: "%azadchat_nick%" 即可显示中文名。
nickname:
  # false = 关闭中文昵称（聊天/TAB 都显示原始 ID）
  enabled: false
  file: "/home/minecraft/nijijoji/mc01/plugins/ChineseName/config.yml"

# 昵称最大长度（按字符截断，防止刷屏）
nickname-maxlength: 24

render:
  # %name% = 服务器标签 + 中文昵称（+ LuckPerms 前后缀），%message% = 消息本体（保留 translate / hover）
  chat-format: "%name%&7: &f%message%"
  death-format: "%name%&7 %message%"
  join-format: "&8[&a+&8] %name%"
  quit-format: "&8[&c-&8] %name%"
  # 是否把跨服消息也打印到代理控制台
  log-to-console: true
