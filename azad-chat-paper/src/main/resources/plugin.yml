name: Azad-Chat
version: 1.0.0
main: dev.azad.chat.paper.AzadChatPaper
api-version: '26.3'
author: Azad
description: 把聊天 / 死亡 / 进服消息推到 Redis 总线，由 Velocity 统一渲染跨服广播
website: https://github.com/AzadKuu/Azad-Chat
softdepend:
  - LuckPerms
commands:
  azadchat:
    description: Azad-Chat 状态与重载
    usage: /azadchat [status|reload]
    permission: azadchat.admin
permissions:
  azadchat.admin:
    description: 允许使用 /azadchat
    default: op
